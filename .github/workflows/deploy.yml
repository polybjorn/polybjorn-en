name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Nothing here has ever taken more than a couple of minutes. Without this,
    # a job that hangs rather than fails sits at "running" for GitHub's six
    # hour default, which reads as still working rather than broken.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # .nvmrc is the one place the version is written. The forge runner gets
      # its node from a container image chosen in nixfleet, which this repo
      # cannot set - so the gate checks that the two agree rather than trusting
      # that they do, and moving the line is a one-line change here plus that
      # image. "22" is the line, not a frozen patch: it takes the newest 22.x.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm install` was resolving the tree afresh on every deploy while the
      # forge gate ran `npm ci` against the lockfile - so the versions that
      # passed the gate were not necessarily the versions that shipped. Same
      # command in both places now, and the lockfile is the answer in both.
      - run: npm ci
      - run: npm run check
      # The gate on the forge runs these, but the forge is not what publishes.
      # A push that reaches here has been reviewed and merged; this is the last
      # point at which a broken build is still unpublished.
      #
      # Order matters: `npm test` is `astro build` plus both suites, and the
      # page tests read dist. `build:deploy` then rebuilds and rewrites it for
      # the two-repo split - it replaces dist/no with redirect stubs - so tests
      # run after it see ten-line stubs instead of pages. Measured: 29 of them
      # fail that way. The second build is a few seconds and buys the order.
      - run: npm test
      - run: npm run build:deploy
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      # dist-no is published by deploy-no, which waits for polybjorn.com to be
      # live, so it has to survive out of this job.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-no
          path: dist-no/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # polybjorn.no has no article pages of its own: its project cards link to
  # polybjorn.com/projects/<slug>. Pushing dist-no from the build job put those
  # cards live before the English pages they point at, because polybjorn.com
  # only publishes once the deploy job above has run - so a new article 404'd
  # from the Norwegian listing, and the edge cached that 404 for ten minutes.
  # Waiting on deploy means the target exists before the link to it does. The
  # cost is that a failed English deploy holds the Norwegian site back too,
  # which is the right way round for a site that links into the other one.
  deploy-no:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-no
          path: dist-no
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.NO_DEPLOY_KEY }}
          external_repository: polybjorn/polybjorn-no
          publish_branch: main
          publish_dir: ./dist-no
          commit_message: ${{ github.event.head_commit.message }}

  indexnow:
    # Both sitemaps are read below, so both sites have to be live first.
    needs: [deploy, deploy-no]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Submit URLs to IndexNow
        run: |
          KEY="088dd9240f9674e496a7140b06f6f997"
          SITEMAP_EN="https://polybjorn.com/sitemap-index.xml"
          SITEMAP_NO="https://polybjorn.no/sitemap-index.xml"

          # Fetch URLs from English sitemap
          URLS_EN=$(curl -s "$SITEMAP_EN" | grep -oP '(?<=<loc>).*?(?=</loc>)')
          for loc in $URLS_EN; do
            if echo "$loc" | grep -q "sitemap.*\.xml"; then
              curl -s "$loc" | grep -oP '(?<=<loc>).*?(?=</loc>)'
            fi
          done | sort -u > /tmp/urls_en.txt

          # Fetch URLs from Norwegian sitemap
          URLS_NO=$(curl -s "$SITEMAP_NO" | grep -oP '(?<=<loc>).*?(?=</loc>)')
          for loc in $URLS_NO; do
            if echo "$loc" | grep -q "sitemap.*\.xml"; then
              curl -s "$loc" | grep -oP '(?<=<loc>).*?(?=</loc>)'
            fi
          done | sort -u > /tmp/urls_no.txt

          # Submit English URLs
          if [ -s /tmp/urls_en.txt ]; then
            URLS_JSON=$(jq -R -s -c 'split("\n") | map(select(length > 0))' /tmp/urls_en.txt)
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"polybjorn.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://polybjorn.com/$KEY.txt\",\"urlList\":$URLS_JSON}"
            echo "Submitted English URLs to IndexNow"
          fi

          # Submit Norwegian URLs
          if [ -s /tmp/urls_no.txt ]; then
            URLS_JSON=$(jq -R -s -c 'split("\n") | map(select(length > 0))' /tmp/urls_no.txt)
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"polybjorn.no\",\"key\":\"$KEY\",\"keyLocation\":\"https://polybjorn.no/$KEY.txt\",\"urlList\":$URLS_JSON}"
            echo "Submitted Norwegian URLs to IndexNow"
          fi
