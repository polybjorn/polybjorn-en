# Deletes the head branch when a pull request merges. The forge-native way to
# do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo,
# where it can be read and changed without admin rights.
#
# Only branches under herd/ are touched, and only when they are merged. A
# closed-unmerged PR, anyone else's branch and main are all left alone.
#
# Two jobs, because an event is not a guarantee. The merge of PR #70 - the one
# that added this file - produced no run at all, not this workflow's and not
# CI's, so the branch it was meant to delete stayed and eleven others had to be
# swept by hand. A job that only reacts to an event goes back to piling
# branches up the moment one is missed, and says nothing while it does. The
# scheduled sweep is what makes a missed event cost a day instead of forever,
# and it is also what covers branches merged before this file existed.
#
# Both jobs delete over git rather than through the API, and both check the
# result with git. The reasoning, and the measurements behind it, are in
# delete-branches.mjs for the sweep and in the action's own header for the
# merge path. The sweep's checkout is not a convenience, it is where its push
# credential comes from, so persist-credentials is written out rather than left
# to the action's default.
name: Delete merged branch

on:
  pull_request:
    types: [closed]
  schedule:
    # Daily, off the hour. That was for the runner's single slot, which CI had
    # first claim on; capacity went to 4 on 2026-09-20, so this waits behind
    # nothing now. Off the hour anyway, because the hour is what everything
    # else picks. Forgejo runs a scheduled workflow from the default branch, so
    # this sweeps with whatever is on main rather than with any branch's copy.
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  # The fast path: no listing, no git of our own, just the branch the event
  # names. It is bjorn/ci-actions/delete-merged-branch@v1 since nixfleet #149 -
  # the same move the attribution job made - so this half no longer shares
  # delete-branches.mjs with the sweep, and the two differ in one way that is
  # deliberate: the action deletes ONCE and keeps what the forge puts back,
  # marking it refs/specimens/<date>/<branch>, where the sweep still retries.
  # A second delete erases the reflog that is the only evidence separating the
  # two faults, and on this path there is a sweep tomorrow to clean up after it.
  merged:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'herd/')
    runs-on: docker
    timeout-minutes: 5
    steps:
      # No checkout: the action needs no working tree, and the push credential
      # is the token passed below rather than one persist-credentials left
      # behind. The full URL including the port is required - a bare
      # `bjorn/ci-actions/...` resolves against data.forgejo.org.
      - uses: https://git-ci.pebblecove.xyz:8447/bjorn/ci-actions/delete-merged-branch@v1
        with:
          token: ${{ github.token }}
          branch: ${{ github.event.pull_request.head.ref }}
          server-url: ${{ github.server_url }}
          repository: ${{ github.repository }}

  # The backstop: every herd/ branch already contained in main, whatever put it
  # there and whatever failed to notice.
  sweep:
    if: github.event_name != 'pull_request'
    runs-on: docker
    timeout-minutes: 10
    steps:
      # fetch-depth 0 for the whole history and every branch: --merged answers
      # with what it can see, and a shallow clone can see one branch and one
      # commit, which would report every other branch as unmerged.
      #
      # Still actions/checkout rather than bjorn/ci-actions/checkout@v1, unlike
      # the rest of the repo: delete-branches.mjs runs ls-remote and
      # push --delete against origin, and persist-credentials below is what
      # authenticates them. That action sets origin to the clean URL on purpose.
      # bjorn/nixfleet#1000.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      # #84: without this the job selects from refs that are not here. The
      # checkout brings the history of the ref being built and nothing else, so
      # this job listed no branches whatever was on the remote and printed "no
      # merged herd/ branches" to a remote it could not see. It never worked:
      # it was added on 2026-09-14 and fixed on 2026-09-15, having run twice.
      # It is a step of its own rather than a line inside the script so that
      # the fetch, and any failure of it, is visible in the job log.
      - name: Fetch the remote's branch refs
        run: git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Delete every merged herd/ branch
        run: |
          set -eu
          # git decides what "merged" means, not a string comparison: a branch
          # is gone only when its commits are reachable from main. The
          # selection is shared with the #73 watchdog so the two jobs cannot
          # drift about what "ours" and "merged" mean.
          branches="$(node .forgejo/scripts/list-merged-branches.mjs)"
          if [ -z "$branches" ]; then
            echo "no merged herd/ branches"
            exit 0
          fi
          # shellcheck disable=SC2086
          node .forgejo/scripts/delete-branches.mjs $branches
