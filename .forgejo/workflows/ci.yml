# Build gate on the self-hosted runner (media-runner, docker label ->
# node:22-bookworm; engines say >=20). Plain `astro build`, not build:deploy -
# prepare-deploy.mjs is a deploy step, and Pages deploy plus the Typst CV job
# stay in .github/workflows/ off the push mirror (setup-typst and artifact
# upload are GitHub-specific).
#
# check-attribution.sh gates AI attribution (Co-Authored-By: Claude,
# "Generated with Claude Code") in commit messages and PR descriptions.
# CLAUDE.md says not to add these; an agent has followed a conflicting
# session-level instruction and added them anyway more than once regardless.
# Also enforced by memory alone until this, and memory alone did not hold.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref. Four pushes to a pull request branch in a row queue four
# builds on a runner with one slot, and only the last of them says anything
# about what is being merged. Pushes to main are never cancelled: the
# attribution job reads the range a push added, so a run skipped there is a
# hole in the record rather than a repeat of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: docker
    # A green run here takes about fifteen seconds. With no timeout a wedged
    # runner holds the job at "running" until Forgejo's six hour default, which
    # reads as still working rather than broken - and on a single-slot runner it
    # keeps attribution queued behind it for the same six hours. Ten minutes is
    # far more than the job has ever needed and still fails the same evening.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The only step that talks to the network, so the only one that stalls
      # instead of failing.
      - run: npm ci
        timeout-minutes: 5
      - run: npm run build
      # The suite was in the repo and outside the gate: nothing ran it unless
      # someone ran it by hand. `npm test` builds first, which the step above
      # has already done, so the two halves are run directly instead.
      - run: npm run test:worker
      - run: npm run test:pages

  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            ./check-attribution.sh commits "origin/${{ github.event.pull_request.base.ref }}..HEAD"
            exit 0
          fi
          # On a push, read what the push actually added. This used to be
          # `commits -1`, which on main is the merge commit and nothing else -
          # and a merge commit carries none of the trailers its parents do, so
          # anything that got past the pull_request job was invisible from then
          # on. That is how fc99a53 landed and main still went green.
          zero=0000000000000000000000000000000000000000
          after=${AFTER:-HEAD}
          [ "$after" = "$zero" ] && after=HEAD
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..$after"
          else
            # First push of a branch, or a runner that does not hand us the
            # previous tip. For a merge this is the branch it merged in; for a
            # plain commit it is that commit, which is what the old form did.
            range="$after^1..$after"
          fi
          echo "Checking $range"
          ./check-attribution.sh commits "$range"
      - name: Check PR description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          ./check-attribution.sh body /tmp/pr-body.txt
