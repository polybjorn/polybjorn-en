# Build gate on the self-hosted runner (media-runner, docker label ->
# node:24-bookworm; engines say >=22.12.0). Plain `astro build`, not build:deploy -
# prepare-deploy.mjs is a deploy step, and Pages deploy plus the Typst CV job
# stay in .github/workflows/ off the push mirror (setup-typst and artifact
# upload are GitHub-specific).
#
# The attribution gate is bjorn/ci-actions/attribution@v1 since nixfleet #149,
# not a script in this tree. It gates AI attribution in commit messages and PR
# descriptions - authorship trailers, session trailers, the generator line,
# vendor URLs - which CLAUDE.md forbids and which an agent following a
# conflicting session-level instruction has added anyway more than once. This
# repo paid for the other half of that gate with a 102-commit history rewrite
# on 2026-09-13, when the push range was the merge commit alone; the action
# carries the fixed range and a selftest that runs ahead of the check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref. Four pushes to a pull request branch in a row queue four
# builds on a runner with one slot, and only the last of them says anything
# about what is being merged. Pushes to main are never cancelled: the
# attribution job reads the range a push added, so a run skipped there is a
# hole in the record rather than a repeat of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: docker
    # A green run here takes about fifteen seconds. With no timeout a wedged
    # runner holds the job at "running" until Forgejo's six hour default, which
    # reads as still working rather than broken - and on a single-slot runner it
    # keeps attribution queued behind it for the same six hours. Ten minutes is
    # far more than the job has ever needed and still fails the same evening.
    timeout-minutes: 10
    # npm's default retry chain takes 70 seconds to give up on a registry that
    # does not answer, and 7m25s in the shape media-runner fails right now -
    # measured twice, identical to the second (nixfleet #136). Bounded, the same
    # failure takes 10 seconds. The runner has one slot, so every minute a
    # doomed install spends retrying is a minute no other repo's CI can run.
    env:
      npm_config_fetch_retries: 1
      npm_config_fetch_timeout: 15000
      # Has to stay above npm's mintimeout of 10s or npm refuses the config
      # outright - "minTimeout is greater than maxTimeout", and the step fails
      # for a reason that has nothing to do with the network.
      npm_config_fetch_retry_maxtimeout: 20000
    steps:
      - uses: https://git-ci.pebblecove.xyz:8447/bjorn/ci-actions/checkout@v1
        with:
          token: ${{ github.token }}
      # The container image comes from the runner's docker label, configured in
      # nixfleet, so nothing in this repo makes it agree with .nvmrc - and for a
      # while it did not: the gate ran node 22 while the deploy ran 24, which is
      # how a version-specific failure reaches the site without the gate seeing
      # it. This does not fix the version; it refuses to be quiet about it.
      - name: Node matches .nvmrc
        run: |
          set -eu
          want=$(tr -d 'v \n' < .nvmrc | cut -d. -f1)
          have=$(node -p 'process.versions.node.split(".")[0]')
          [ "$want" = "$have" ] || {
            echo "runner is on node $have, .nvmrc asks for $want"
            echo "move the runner image in nixfleet, or .nvmrc here - not one alone"
            exit 1
          }
      # A build that cannot reach the registry and a build with a real error are
      # the same red tick from here, five minutes apart. This asks the one
      # question that tells them apart and answers it in about a second when the
      # answer is yes, so a run that fails after it is a run worth reading.
      - name: Registry answers
        run: npm ping
        timeout-minutes: 1
      # The only other step that talks to the network, so the only other one
      # that stalls instead of failing.
      - run: npm ci
        timeout-minutes: 5
      # tsconfig has extended astro/tsconfigs/strict since the repo was set up
      # and nothing ran the checker, so the intent was recorded and unenforced.
      # It is enforced from here: the 47 errors that had accumulated are fixed,
      # and the cheapest moment to keep that true is before the build.
      - run: npm run check
      - run: npm run build
      # The suite was in the repo and outside the gate: nothing ran it unless
      # someone ran it by hand. `npm test` builds first, which the step above
      # has already done, so the two halves are run directly instead.
      - run: npm run test:worker
      - run: npm run test:pages

  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      # One copy, in bjorn/ci-actions, replacing the seven this gate had
      # drifted into (nixfleet #149). No checkout step: the action does its own
      # in pure git, which is also what lets the same reference work on the
      # python and nix labels, where actions/checkout cannot run. The full URL
      # is required - a bare namespaced reference resolves to data.forgejo.org.
      - uses: https://git-ci.pebblecove.xyz:8447/bjorn/ci-actions/attribution@v1
        with:
          token: ${{ github.token }}
          event-name: ${{ github.event_name }}
          sha: ${{ github.sha }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          before: ${{ github.event.before }}
          pr-body: ${{ github.event.pull_request.body }}

